#
# PEP 517/518 build config (replaces setup.py, which is deprecated as a direct
# build interface — see issue #2). Metadata lives here; the tool stays a single
# self-contained module (lsgpu.py) with zero runtime dependencies, still runnable
# as `python3 lsgpu.py`.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lsgpus"
version = "0.2.6"
description = "List GPUs with details — like lscpu/lsusb but for graphics cards"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Guy-Marc APRIN", email = "2026@gm.casa" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/AGuyMarc/lsgpu"
Repository = "https://github.com/AGuyMarc/lsgpu"
Issues = "https://github.com/AGuyMarc/lsgpu/issues"
Changelog = "https://github.com/AGuyMarc/lsgpu/blob/main/CHANGELOG.md"

[project.scripts]
lsgpus = "lsgpu:main"

[tool.setuptools]
py-modules = ["lsgpu"]
